<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a screen moves through kitvas</title>
  <desc id="d">Six parts joined in a row. Your request and your kit go into Compose, where one agent writes each section. Check builds the draft and reads it in a real browser, and sends it back to Compose for fix rounds. The Studio shows it, lets you edit it and compare versions; your feedback or your edits start the next version in Compose. A finished draft is handed off to your code or to Figma. Check and Studio run on your machine, with no model.</desc>
