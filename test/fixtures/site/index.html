<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme plans</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Choose a plan</h1>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="text" placeholder="you@example.com" />
      </div>
      <div class="card">
        <h2>Starter plan</h2>
        <p>For one person.</p>
      </div>
      <button class="button" type="button">Save changes</button>
      <img src="/private.png" alt="" width="1" height="1" />
    </main>
    <section class="cookie" aria-label="Cookies">
      <span>We use cookies.</span>
      <button class="button" type="button">Accept cookies</button>
    </section>
  </body>
</html>
