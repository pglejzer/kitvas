<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text facts</title>
    <style>
      body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
      #para { width: 320px; margin: 16px; font-size: 16px; line-height: 24px; }
      #truth { margin: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">
      <article data-ks="sections/Story:article">
        <p id="para" data-ks="sections/Story:article/p">Kitvas measures each paragraph by its line boxes, so the widest line of a text block is counted the way a reader sees it on screen.</p>
        <p id="truth" data-ks="sections/Story:article/truth"></p>
      </article>
    </div>
    <script>
      // The count the facts are held to: every character's own box, grouped by the top of its line.
      // Written as "<lines> <characters on the widest line>" into #truth, after the paragraph, so the
      // paragraph's layout does not change.
      const text = document.getElementById('para').firstChild;
      const lines = new Map();
      for (let at = 0; at < text.data.length; at += 1) {
        const range = document.createRange();
        range.setStart(text, at);
        range.setEnd(text, at + 1);
        const rect = range.getClientRects()[0];
        if (!rect) continue;
        const key = Math.round(rect.top / 4);
        lines.set(key, (lines.get(key) || 0) + 1);
      }
      document.getElementById('truth').textContent = `${lines.size} ${Math.max(...lines.values())}`;
    </script>
  </body>
</html>
