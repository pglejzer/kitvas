<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deep: long text</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }
      #root {
        padding: 16px;
      }
      /* A fixed size: a longer label is cut. */
      .chip {
        display: inline-block;
        width: 72px;
        height: 24px;
        padding: 0 8px;
        overflow: hidden;
        white-space: nowrap;
        font-size: 14px;
        line-height: 24px;
        border-radius: 12px;
        background: #eef2f7;
      }
      /* No wrapping: a longer line runs past the screen. */
      .tagline {
        margin: 16px 0;
        white-space: nowrap;
      }
      /* Cut on purpose, with an ellipsis. */
      .name {
        display: block;
        width: 160px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      /* Visually hidden: clipped by design before anything grows. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <span class="chip" id="chip">Beta</span>
      <p class="tagline" id="tagline">Free returns on every order</p>
      <h2 id="title">Fresh bread from our oven every morning</h2>
      <span class="name" id="name">Jane Cooper</span>
      <span class="sr-only" id="hidden">Opens the cart</span>
      <p>Orders: <span id="count">12</span></p>
    </div>
  </body>
</html>
