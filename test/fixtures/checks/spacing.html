<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text spacing</title>
    <style>
      body { margin: 0; padding: 16px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
      button { display: block; margin-bottom: 16px; font-family: inherit; }
      /*
        Fits at its own line height (1.2, above any font's glyph height); the override's 1.5 makes
        the line 6 px taller than the button.
      */
      #tight {
        box-sizing: border-box; height: 24px; padding: 0 8px; border: 0; font-size: 20px;
        line-height: 24px; overflow: hidden; white-space: nowrap; background: #1d4ed8; color: #ffffff;
      }
      #roomy { padding: 8px 16px; font-size: 16px; line-height: 1.5; border: 1px solid #1a1a1a; background: #ffffff; }
      /* Cut off before the override too: nothing new. */
      #cut { height: 12px; overflow: hidden; font-size: 16px; line-height: 24px; }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-ks="sections/Actions:main">
        <button id="tight" type="button" data-ks="sections/Actions:main/tight">Save</button>
        <button id="roomy" type="button" data-ks="sections/Actions:main/roomy">Cancel</button>
        <div id="cut" data-ks="sections/Actions:main/cut">Already cut before the override.</div>
      </main>
    </div>
  </body>
</html>
