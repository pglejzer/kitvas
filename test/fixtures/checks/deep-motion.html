<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deep: motion</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }
      #root {
        padding: 16px;
      }
      @keyframes pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.4;
        }
      }
      .dot {
        width: 40px;
        height: 40px;
        border-radius: 20px;
      }
      /* Runs forever, and nothing stops it when reduced motion is asked for. */
      .busy {
        background: #0f7a52;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      /* Runs forever too, but stops for reduced motion. */
      .calm {
        background: #1d4ed8;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      /* Runs once. */
      .once {
        background: #b45309;
        animation: pulse 0.2s ease-in-out 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .calm {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="banner" aria-label="New arrivals">
        <div class="dot busy" id="busy"></div>
        <p>New arrivals every week.</p>
      </section>
      <section aria-label="Offers">
        <div class="dot calm" id="calm"></div>
        <p>Ten percent off your first order.</p>
      </section>
      <div class="dot once" id="once"></div>
    </div>
  </body>
</html>
