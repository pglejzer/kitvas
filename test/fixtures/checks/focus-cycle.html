<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A focus trap</title>
    <style>
      body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #1a1a1a; }
      main { padding: 16px; }
      button {
        appearance: none; display: block; margin: 16px 0; padding: 8px 12px; font: inherit;
        color: #111111; background: #eeeeee; border: 1px solid #888888; border-radius: 0;
      }
      /* No indicator at all: nothing computed changes and no pixel does. */
      #plain, #plain:focus, #plain:focus-visible { outline: none; }
      /* A ring of its own, drawn as a shadow. */
      #ringed:focus-visible { outline: none; box-shadow: 0 0 0 3px #1d4ed8; }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-ks="sections/Trap:main">
        <button id="first" type="button" data-ks="sections/Trap:main/first">First</button>
        <button id="plain" type="button" data-ks="sections/Trap:main/plain">Plain</button>
        <button id="ringed" type="button" data-ks="sections/Trap:main/ringed">Ringed</button>
      </main>
    </div>
    <script>
      // Tab on the last button goes back to the first, as a dialog's focus trap does.
      document.getElementById('ringed').addEventListener('keydown', (event) => {
        if (event.key !== 'Tab' || event.shiftKey) return;
        event.preventDefault();
        document.getElementById('first').focus();
      });
    </script>
  </body>
</html>
