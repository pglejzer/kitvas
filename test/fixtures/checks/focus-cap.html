<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many stops</title>
    <style>
      body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #1a1a1a; }
      button { display: block; margin: 4px 16px; font: inherit; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="list" data-ks="sections/List:main"></main>
    </div>
    <script>
      // More buttons than the focus walk presses Tab.
      const list = document.getElementById('list');
      for (let n = 1; n <= 70; n += 1) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `Item ${n}`;
        button.setAttribute('data-ks', 'sections/List:main/button');
        list.append(button);
      }
    </script>
  </body>
</html>
