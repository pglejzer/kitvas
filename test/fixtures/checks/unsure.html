<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text over a picture</title>
    <style>
      body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #1a1a1a; background: #ffffff; }
      .hero { padding: 24px; background-image: linear-gradient(#202020, #3a3a3a); }
      .hero p { margin: 0; color: #ffffff; }
      .plain { margin: 16px 24px; }
    </style>
  </head>
  <body>
    <div id="root">
      <section class="hero" data-ks="sections/Hero:section">
        <p id="over" data-ks="sections/Hero:section/p">Text over a picture</p>
      </section>
      <p class="plain" data-ks="sections/Hero:p">Plain text on white.</p>
    </div>
  </body>
</html>
